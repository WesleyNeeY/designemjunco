name: Build do aplicativo
on:
  push:
    branches: [melhorias-painel]
    paths: ['source/**', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e gerar build
        working-directory: source
        run: |
          npm ci
          npm run build
      - name: Copiar build para a raiz
        run: |
          rm -rf assets index.html
          cp -r source/dist/. .
          rm -rf source/dist
      - name: Salvar build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build automático do aplicativo"
          git push
